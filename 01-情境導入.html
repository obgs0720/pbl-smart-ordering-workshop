<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>01 情境導入</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body><main class="lesson"><p class="eyebrow">階段 01｜15 分鐘</p><h1>情境導入：看見午餐尖峰問題</h1><p class="lesson-lead">先感受等待、錯單與取餐混亂，不直接從「做系統」開始。</p><h2>教師操作</h2><ol><li>展示人流、等待時間與錯單紀錄。</li><li>請學生以學生、店家、校方角色描述困擾。</li><li>追問真正需要改善的是哪個環節。</li></ol><h2>學生任務與產出</h2><p>閱讀任務卡，標示已知事實與待確認資訊，完成利害關係人清單。</p><a class="download" href="教材/01_情境任務卡與模擬資料包.docx" download>下載情境任務卡與資料包 DOCX</a><nav class="lesson-nav"><a href="index.html">回首頁</a><a href="02-WSQ課前自學.html">下一步：WSQ</a></nav></main></body></html>
